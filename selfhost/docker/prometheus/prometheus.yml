# Job names match the VM route, so the shared alert rules apply
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node_exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: mongodb_exporter
    static_configs:
      - targets:
          - mongodb-exporter:9216

  - job_name: blackbox_backend_health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:8000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # The database, on this host's backend and on the public URL, which reaches whichever host answers
  - job_name: blackbox_database
    metrics_path: /probe
    params:
      module: [http_database_connected]
    static_configs:
      - targets:
          - http://backend:8000/health
          - https://quantaid.org/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # From outside, through Cloudflare, like a user
  - job_name: blackbox_public_health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://quantaid.org/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
