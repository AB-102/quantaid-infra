---
all:
  children:
    quantaid:
      children:
        proxy:
          hosts:
            proxy.lab.home.arpa:
              ansible_host: 192.168.111.10
        frontend:
          hosts:
            frontend.lab.home.arpa:
              ansible_host: 192.168.111.20
        backend:
          hosts:
            backend.lab.home.arpa:
              ansible_host: 192.168.111.30
        dns:
          hosts:
            dns.lab.home.arpa:
              ansible_host: 192.168.111.53
        monitoring:
          hosts:
            monitoring.lab.home.arpa:
              ansible_host: 192.168.111.40
    # Configured by playbooks/docker_host.yml. Outside the quantaid group, so site.yml never touches them.
    docker_hosts:
      hosts:
        quantaid-laptop:
          ansible_host: 10.67.1.100
          is_laptop: true
          ssh_from_home_lan_only: true
          # Prometheus, Grafana and the exporters run here only
          compose_profiles: monitoring
          backend_workers: 2
          # Its minute in every 5 for updates, so no two hosts drain at once
          update_offset_minutes: 0
          gate_enabled: true
        quantaid-azure:
          # The azure Terraform stack's host_fqdn output
          ansible_host: quantaid-azure.REGION.cloudapp.azure.com
          is_laptop: false
          ssh_from_home_lan_only: false
          compose_profiles: ""
          backend_workers: 1
          swap_mb: 2048
          update_offset_minutes: 3
          gate_enabled: false
