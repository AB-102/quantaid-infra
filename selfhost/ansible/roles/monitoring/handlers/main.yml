---
- name: restart mongodb_exporter
  ansible.builtin.systemd:
    name: mongodb_exporter
    state: restarted

- name: restart blackbox_exporter
  ansible.builtin.systemd:
    name: blackbox_exporter
    state: restarted

- name: restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted

- name: restart grafana-server
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
