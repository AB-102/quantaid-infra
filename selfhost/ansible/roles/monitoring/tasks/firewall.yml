---
- name: Allow Grafana from the LAN
  community.general.ufw:
    rule: allow
    src: "{{ lan_subnet }}"
    port: '3000'

- name: Allow Prometheus from the LAN
  community.general.ufw:
    rule: allow
    src: "{{ lan_subnet }}"
    port: '9090'

- name: Enable UFW
  community.general.ufw:
    state: enabled
