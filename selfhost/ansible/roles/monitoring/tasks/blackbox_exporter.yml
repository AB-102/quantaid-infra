---
- name: Install blackbox_exporter
  ansible.builtin.include_role:
    name: tarball_binary
  vars:
    tb_url: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64.tar.gz"
    tb_checksum: "sha256:https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/sha256sums.txt"
    tb_binaries:
      - "blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64/blackbox_exporter"

- name: Ensure blackbox_exporter config directory exists
  ansible.builtin.file:
    path: /etc/blackbox_exporter
    state: directory
    mode: '0755'

- name: Deploy blackbox_exporter config
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/blackbox_exporter/blackbox.yml
    mode: '0644'
  notify: restart blackbox_exporter

- name: Deploy blackbox_exporter systemd unit
  ansible.builtin.template:
    src: blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    mode: '0644'
  notify: restart blackbox_exporter

- name: Ensure blackbox_exporter is enabled and running
  ansible.builtin.systemd:
    name: blackbox_exporter
    enabled: true
    state: started
    daemon_reload: true
