---
- name: Install npm and git
  ansible.builtin.apt:
    name:
      - npm
      - git
    state: present
    update_cache: true

# serve isn't a frontend dependency, so it's installed globally
- name: Install serve (static file server for dist)
  community.general.npm:
    name: serve
    version: "14"
    global: true

# Clone only; afterwards the auto_update timer moves the checkout to each passing commit
- name: Clone the frontend repository
  ansible.builtin.git:
    repo: "{{ frontend_repo }}"
    dest: /home/anb/quantaid-frontend
    version: main
    force: true
    update: false
  become: false
  register: frontend_git

- name: Deploy frontend .env
  ansible.builtin.template:
    src: frontend.env.j2
    dest: /home/anb/quantaid-frontend/frontend/.env
    mode: '0600'
  become: false
  register: frontend_env
  notify: restart quantaid-frontend

- name: Run npm ci
  ansible.builtin.command: npm ci
  args:
    chdir: /home/anb/quantaid-frontend/frontend
  become: false
  when: frontend_git.changed or frontend_env.changed
  changed_when: true

- name: Run npm run build
  ansible.builtin.command: npm run build
  args:
    chdir: /home/anb/quantaid-frontend/frontend
  become: false
  when: frontend_git.changed or frontend_env.changed
  changed_when: true

- name: Deploy frontend systemd unit
  ansible.builtin.template:
    src: quantaid-frontend.service.j2
    dest: /etc/systemd/system/quantaid-frontend.service
    mode: '0644'
  notify: restart quantaid-frontend

- name: Ensure quantaid-frontend is enabled and running
  ansible.builtin.systemd:
    name: quantaid-frontend
    enabled: true
    state: started
    daemon_reload: true

- name: Install the auto-update timer
  ansible.builtin.include_role:
    name: auto_update
  vars:
    au_service: quantaid-frontend
    au_github_repo: "{{ frontend_github_repo }}"
    au_repo_dir: /home/anb/quantaid-frontend
    au_build_dir: /home/anb/quantaid-frontend/frontend
    au_build_commands:
      - npm ci
      - npm run build

- name: Allow the frontend port from the proxy VM
  community.general.ufw:
    rule: allow
    src: "{{ hostvars[groups['proxy'][0]].ansible_host }}"
    port: '5173'

- name: Enable UFW
  community.general.ufw:
    state: enabled
