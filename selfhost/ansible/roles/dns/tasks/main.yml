---
- name: Install bind
  ansible.builtin.dnf:
    name:
      - bind
      - bind-utils
    state: present

- name: Deploy DNS zone file
  ansible.builtin.template:
    src: db.lab.home.arpa.j2
    dest: "/var/named/db.{{ lab_domain }}"
    owner: root
    group: named
    mode: '0640'
    validate: "named-checkzone {{ lab_domain }} %s"
  notify: restart named

- name: Deploy named.conf
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: '0640'
    validate: named-checkconf %s
  notify: restart named

- name: Ensure named is enabled and running
  ansible.builtin.systemd:
    name: named
    enabled: true
    state: started
    daemon_reload: true

- name: Allow DNS queries from the LAN
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ lan_subnet }}" service name="dns" accept'
    permanent: true
    immediate: true
    state: enabled
