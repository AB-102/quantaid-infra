---
- name: Set UFW default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: in

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    default: allow
    direction: out

- name: Allow SSH from the LAN
  community.general.ufw:
    rule: allow
    proto: tcp
    src: "{{ lan_subnet }}"
    port: '22'

- name: Allow node_exporter scrape from the monitoring VM
  community.general.ufw:
    rule: allow
    src: "{{ hostvars[groups['monitoring'][0]].ansible_host }}"
    port: '9100'
  when: inventory_hostname not in groups['monitoring']
