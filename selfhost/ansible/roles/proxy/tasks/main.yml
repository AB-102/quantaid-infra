---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy the nginx site config
  ansible.builtin.template:
    src: nginx-lab.conf.j2
    dest: /etc/nginx/sites-available/lab
    mode: '0644'
  notify: reload nginx

- name: Enable the nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lab
    dest: /etc/nginx/sites-enabled/lab
    state: link
  notify: reload nginx

- name: Check nginx config is valid
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Allow loopback access to nginx (cloudflared connects via localhost)
  community.general.ufw:
    rule: allow
    src: 127.0.0.1
    port: '80'

- name: Enable UFW
  community.general.ufw:
    state: enabled
