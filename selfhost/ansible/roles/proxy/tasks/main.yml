---
- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

# Rocky's nginx.conf keeps its own port-80 server block; lab.conf takes over as default_server
- name: Deploy the nginx site config
  ansible.builtin.template:
    src: nginx-lab.conf.j2
    dest: /etc/nginx/conf.d/lab.conf
    mode: '0644'
  notify: reload nginx

- name: Check nginx config is valid
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Let nginx proxy to the frontend and backend VMs (SELinux blocks outbound connections from nginx otherwise)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

# cloudflared reaches nginx over loopback, which firewalld never filters, so port 80 needs no rule
