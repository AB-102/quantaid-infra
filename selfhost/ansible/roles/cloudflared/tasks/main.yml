---
# Runs the connector for the locally-managed tunnel: ingress from files/config.yml, auth from the token.

- name: Add the cloudflared repository
  ansible.builtin.yum_repository:
    name: cloudflared-stable
    description: cloudflared-stable
    baseurl: https://pkg.cloudflare.com/cloudflared/rpm
    gpgkey: https://pkg.cloudflare.com/cloudflare-ascii-pubkey.gpg
    gpgcheck: true

- name: Install cloudflared
  ansible.builtin.dnf:
    name: cloudflared
    state: present

- name: Ensure /etc/cloudflared exists
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    mode: '0755'

# A root-only token file keeps the token out of the unit file and the process list
- name: Deploy the connector token
  ansible.builtin.copy:
    content: "{{ proxy_cloudflare_tunnel_token }}"
    dest: /etc/cloudflared/token
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: restart cloudflared

- name: Deploy the ingress config
  ansible.builtin.copy:
    src: config.yml
    dest: /etc/cloudflared/config.yml
    mode: '0644'
  notify: restart cloudflared

- name: Deploy the cloudflared systemd unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    mode: '0644'
  notify: restart cloudflared

- name: Ensure cloudflared is enabled and running
  ansible.builtin.systemd:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true
