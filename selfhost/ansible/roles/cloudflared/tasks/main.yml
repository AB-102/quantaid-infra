---
# Installs the connector for a remotely-managed tunnel (created in the Cloudflare dashboard).

- name: Add Cloudflare apt signing key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: '0644'

- name: Add cloudflared apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main"
    filename: cloudflared
  register: cloudflared_repo

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: "{{ cloudflared_repo.changed }}"

- name: Ensure /etc/cloudflared exists
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    mode: '0755'

# A root-only token file keeps the token out of the unit file and the process list
- name: Deploy the connector token
  ansible.builtin.copy:
    content: "{{ proxy_cloudflare_tunnel_token }}"
    dest: /etc/cloudflared/token
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: restart cloudflared

- name: Deploy the cloudflared systemd unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    mode: '0644'
  notify: restart cloudflared

- name: Ensure cloudflared is enabled and running
  ansible.builtin.systemd:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true
