---
# ansible.cfg sets become: true; tasks under /home/anb use become: false so anb owns the files.

- name: Install git
  ansible.builtin.dnf:
    name: git
    state: present

# Not in ~/.local/bin: SELinux won't let systemd run a program from /home (the unit would fail with 203/EXEC).
# uv also manages the backend's Python, so the system Python's version doesn't matter.
- name: Install uv into /usr/local/bin
  ansible.builtin.shell: curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
  args:
    creates: /usr/local/bin/uv

# Clone only; afterwards the auto_update timer moves the checkout to each passing commit
- name: Clone the backend repository
  ansible.builtin.git:
    repo: "{{ backend_repo }}"
    dest: /home/anb/quantaid-backend
    version: main
    force: true
    update: false
  become: false
  register: backend_git

- name: Deploy backend .env
  ansible.builtin.template:
    src: backend.env.j2
    dest: /home/anb/quantaid-backend/.env
    mode: '0600'
  become: false
  register: backend_env
  notify: restart quantaid-backend

- name: Run uv sync
  ansible.builtin.command: /usr/local/bin/uv sync
  args:
    chdir: /home/anb/quantaid-backend
  become: false
  when: backend_git.changed or backend_env.changed
  changed_when: true

- name: Deploy backend systemd unit
  ansible.builtin.template:
    src: quantaid-backend.service.j2
    dest: /etc/systemd/system/quantaid-backend.service
    mode: '0644'
  notify: restart quantaid-backend

- name: Ensure quantaid-backend is enabled and running
  ansible.builtin.systemd:
    name: quantaid-backend
    enabled: true
    state: started
    daemon_reload: true

- name: Install the auto-update timer
  ansible.builtin.include_role:
    name: auto_update
  vars:
    au_service: quantaid-backend
    au_github_repo: "{{ backend_github_repo }}"
    au_repo_dir: /home/anb/quantaid-backend
    au_build_dir: /home/anb/quantaid-backend
    au_build_commands:
      - /usr/local/bin/uv sync

# The proxy VM forwards /api here, and the monitoring VM's blackbox exporter probes /health
- name: Allow the backend port from the proxy and monitoring VMs
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="8000" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  loop:
    - "{{ hostvars[groups['proxy'][0]].ansible_host }}"
    - "{{ hostvars[groups['monitoring'][0]].ansible_host }}"
